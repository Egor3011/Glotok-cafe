# This file is included in the official image's http context.
map "$status:$uri" $site_cache_control {
    default "no-cache";
    ~*^(200|206|304):.*\.(css|js|ttf|woff2?|svg|webp|png|jpe?g|ico)$ "public, max-age=86400, must-revalidate";
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    autoindex off;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Cache-Control $site_cache_control always;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Do not expose hidden files, including dot-directories.
    location ~ /\. {
        return 404;
    }
}
